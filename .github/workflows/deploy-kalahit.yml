name: KALA HIT deployment preflight (blocked until target is verified)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked-until-host-verified:
    runs-on: ubuntu-latest
    steps:
      - name: Explain why production deployment is blocked
        run: |
          echo "::notice title=Deployment intentionally blocked::lalhit.fun is served through Hostinger's CDN, but its authoritative publishing target has not been verified."
          echo "No files were uploaded and no Netlify project was modified."
          echo "Restore a deployment job only after the canonical lalhit.fun hosting target and exact site identity are verified."
