name: Deploy KALA HIT to Netlify

on:
  push:
    branches: [main]
    paths:
      - "kala-hit-standalone/**"
      - "netlify.toml"
      - ".github/workflows/deploy-kalahit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Publish KALA HIT to the existing Netlify site
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: "./kala-hit-standalone"
          production-branch: main
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "KALA HIT Neon Rift from GitHub main"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
