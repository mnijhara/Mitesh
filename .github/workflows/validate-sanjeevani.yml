name: Validate Sanjeevani Quest

on:
  push:
    paths:
      - "sanjeevani-quest/**"
      - "scripts/check-game.mjs"
      - ".github/workflows/validate-sanjeevani.yml"
  pull_request:
    paths:
      - "sanjeevani-quest/**"
      - "scripts/check-game.mjs"
      - ".github/workflows/validate-sanjeevani.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check game HTML, JavaScript, and PWA files
        run: node scripts/check-game.mjs
